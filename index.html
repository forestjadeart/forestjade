<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forest Jade — Works</title>
<meta name="description" content="Forest Jade. Original paintings by Giada.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#eee7d8;
    --ink-dim:#b9b0a0;
    --bg:#100d0a;
    --bg-panel:#171310;
    --line: rgba(238,231,216,0.16);
    --accent:#c9b896;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html{
    scroll-behavior:smooth;
    scroll-snap-type: y mandatory;
  }

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Jost', sans-serif;
    font-weight:300;
    overflow-x:hidden;
  }

  ::selection{ background:var(--accent); color:var(--bg); }

  /* ---------- Home gallery (Page 1) ---------- */
  main{ position:relative; }

  .work{
    display:grid;
    grid-template-columns:1fr 1fr;
    height:100vh;
    width:100%;
    position:relative;
    border-bottom:1px solid var(--line);
    cursor:pointer;
    scroll-snap-align:start;
    scroll-snap-stop:always;
  }

  .work .pane{
    position:relative;
    height:100%;
    overflow:hidden;
  }

  .work .pane img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    filter:saturate(0.95);
    transform:scale(1.02);
    transition:transform 1.6s cubic-bezier(.16,.8,.24,1), filter .8s ease;
  }

  .work:hover .pane img{
    transform:scale(1.07);
    filter:saturate(1.05);
  }

  .pane::after{
    content:"";
    position:absolute; inset:0;
    background:
      linear-gradient(to right, rgba(0,0,0,0.4), rgba(0,0,0,0) 32%),
      linear-gradient(to bottom, rgba(0,0,0,0.3), rgba(0,0,0,0) 22%),
      linear-gradient(to top, rgba(0,0,0,0.3), rgba(0,0,0,0) 40%);
    pointer-events:none;
  }

  .word{
    position:absolute;
    top:50%;
    left:52px;
    transform:translateY(-50%);
    font-family:'EB Garamond', serif;
    font-style:italic;
    font-size:clamp(1.4rem, 2.4vw, 2.1rem);
    color:var(--ink);
    letter-spacing:0.02em;
    z-index:5;
    pointer-events:none;
    text-shadow:0 2px 10px rgba(0,0,0,0.6), 0 2px 24px rgba(0,0,0,0.5);
    opacity:0.94;
  }

  /* ================= Work detail (Page 2) ================= */
  .work-detail{
    position:fixed;
    inset:0;
    background:var(--bg-panel);
    z-index:100;
    transform:translateY(100%);
    transition:transform .8s cubic-bezier(.16,.8,.24,1);
    overflow:hidden;
  }
  .work-detail.open{ transform:translateY(0); }

  .close-btn{
    position:absolute;
    top:26px;
    right:26px;
    z-index:10;
    background:none;
    border:none;
    color:#000;
    font-size:1.3rem;
    line-height:1;
    cursor:pointer;
    opacity:0.85;
    font-family:'Jost', sans-serif;
    padding:6px;
    transition:opacity .3s ease;
  }
  .close-btn:hover{ opacity:1; }

  .detail-grid{
    display:grid;
    grid-template-columns:1.15fr 0.85fr;
    height:100vh;
  }

  .detail-images{
    position:relative;
    height:100vh;
    overflow:hidden;
    background:#0b0906;
  }
  .detail-slide{
    position:absolute;
    inset:0;
    opacity:0;
    visibility:hidden;
    transition:opacity .45s ease, visibility .45s ease;
  }
  .detail-slide.active{
    opacity:1;
    visibility:visible;
  }
  .detail-slide img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .gallery-btn{
    position:absolute;
    top:50%;
    z-index:4;
    width:44px;
    height:44px;
    transform:translateY(-50%);
    border:1px solid rgba(238,231,216,.45);
    border-radius:50%;
    background:rgba(16,13,10,.34);
    color:#eee7d8;
    font-family:'Jost', sans-serif;
    font-size:1.25rem;
    line-height:1;
    cursor:pointer;
    backdrop-filter:blur(3px);
    transition:background .25s ease, border-color .25s ease;
  }
  .gallery-btn:hover{ background:rgba(16,13,10,.68); border-color:#eee7d8; }
  .gallery-btn.prev{ left:22px; }
  .gallery-btn.next{ right:22px; }
  .gallery-count{
    position:absolute;
    left:50%;
    bottom:22px;
    z-index:4;
    transform:translateX(-50%);
    padding:5px 10px;
    border-radius:99px;
    background:rgba(16,13,10,.45);
    color:#eee7d8;
    font-size:.65rem;
    letter-spacing:.14em;
  }

  .detail-info{
    height:100vh;
    overflow-y:auto;
    padding:0 clamp(28px, 4vw, 64px);
    display:flex;
    flex-direction:column;
    justify-content:center;
    background:#efe7d8;
    color:#221c16;
  }

  .detail-info .eyebrow{
    font-size:0.7rem;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:rgba(34,28,22,0.55);
    margin-bottom:clamp(8px, 1.4vh, 14px);
  }
  .detail-info h1{
    font-family:'EB Garamond', serif;
    font-weight:400;
    font-size:clamp(1.6rem, 2.4vw, 2.3rem);
    margin-bottom:clamp(6px, 1.1vh, 10px);
    color:#1a140f;
  }
  .detail-info .specs{
    font-size:0.78rem;
    color:rgba(34,28,22,0.65);
    letter-spacing:0.02em;
    margin-bottom:clamp(12px, 2.2vh, 20px);
    padding-bottom:clamp(10px, 1.8vh, 16px);
    border-bottom:1px solid rgba(34,28,22,0.18);
  }
  .detail-info .specs div{ margin-bottom:2px; }

  .description{
    font-family:'EB Garamond', serif;
    font-style:italic;
    font-size:clamp(0.78rem, 0.55vw + 0.55vh, 0.95rem);
    line-height:1.48;
    color:#2a2118;
  }
  .description p{ margin-bottom:clamp(6px, 1.2vh, 11px); }
  .description p:last-child{ margin-bottom:0; }
  .description strong{ font-weight:500; }

  .inquiries-block{
    margin-top:clamp(12px, 2.4vh, 22px);
    padding-top:clamp(10px, 1.8vh, 16px);
    border-top:1px solid rgba(34,28,22,0.18);
  }
  .inquiries-block .eyebrow{ margin-bottom:clamp(10px, 1.8vh, 16px); }

  .inquiry-form{
    display:flex;
    gap:0;
    align-items:stretch;
    max-width:440px;
  }
  .inquiry-form input{
    flex:1;
    background:none;
    border:none;
    border-bottom:1px solid rgba(34,28,22,0.3);
    color:#221c16;
    font-family:'Jost', sans-serif;
    font-weight:300;
    font-size:0.95rem;
    padding:12px 4px;
    outline:none;
    transition:border-color .3s ease;
  }
  .inquiry-form input::placeholder{ color:rgba(34,28,22,0.45); }
  .inquiry-form input:focus{ border-color:#221c16; }
  .inquiry-form button{
    font-family:'Jost', sans-serif;
    font-size:0.72rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:#221c16;
    background:#fbf8f1;
    border:1px solid rgba(34,28,22,0.35);
    padding:0 26px;
    margin-left:14px;
    cursor:pointer;
    transition:background .3s ease, color .3s ease;
    white-space:nowrap;
  }
  .inquiry-form button:hover{ background:#221c16; color:#fbf8f1; }

  .sent-msg{
    font-family:'EB Garamond', serif;
    font-style:italic;
    font-size:1rem;
    color:#443628;
    display:none;
    margin-top:4px;
  }

  @media (max-width: 860px){
    /* HOME MOBILE: each work is one vertical pair of true squares. */
    .work{
      grid-template-columns:1fr;
      grid-template-rows:100vw 100vw;
      height:200vw;
      min-height:0;
      width:100vw;
      scroll-snap-align:start;
      scroll-snap-stop:always;
    }
    .work .pane{
      width:100vw;
      height:100vw;
      aspect-ratio:1 / 1;
      overflow:hidden;
      background:#0b0906;
    }
    .work .pane img{
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center;
      transform:none;
    }
    .work:hover .pane img{ transform:none; }
    .word{ top:50%; transform:translateY(-50%); font-size:1.3rem; left:20px; }

    /* DETAIL: natural document flow on mobile instead of a rigid 42/58 split. */
    .work-detail{
      overflow-y:auto;
      overflow-x:hidden;
      -webkit-overflow-scrolling:touch;
      background:#efe7d8;
    }
    .detail-grid{
      display:block;
      width:100%;
      height:auto;
      min-height:100dvh;
    }

    /* DETAIL MOBILE: one fixed, large 3:4 frame for every slide. */
    .detail-images{
      position:relative;
      width:100vw;
      height:auto;
      min-height:0;
      aspect-ratio:3 / 4;
      background:#d8d1c5;
      overflow:hidden;
    }
    .detail-slide{ inset:0; }
    .detail-slide img{
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center;
      display:block;
    }

    .gallery-btn{ width:38px; height:38px; font-size:1rem; }
    .gallery-btn.prev{ left:12px; }
    .gallery-btn.next{ right:12px; }
    .gallery-count{ bottom:12px; }

    .detail-info{
      width:100%;
      height:auto;
      min-height:0;
      overflow:visible;
      padding:24px 22px 34px;
      display:block;
      background:#efe7d8;
    }
    .detail-info .eyebrow{ margin-bottom:10px; }
    .detail-info h1{ font-size:clamp(1.65rem, 7vw, 2rem); margin-bottom:10px; }
    .detail-info .specs{
      font-size:.78rem;
      line-height:1.5;
      margin-bottom:18px;
      padding-bottom:16px;
    }
    .description{
      font-size:clamp(.94rem, 4.15vw, 1.05rem);
      line-height:1.5;
    }
    .description p{ margin-bottom:14px; }
    .inquiries-block{ margin-top:22px; padding-top:17px; }
    .inquiry-form{ max-width:none; width:100%; }
    .inquiry-form input{ min-width:0; }
    .inquiry-form button{ padding:0 22px; margin-left:12px; }

    .close-btn{
      position:fixed;
      top:max(14px, env(safe-area-inset-top));
      right:14px;
      width:40px;
      height:40px;
      padding:0;
      border-radius:50%;
      display:grid;
      place-items:center;
      background:rgba(239,231,216,.82);
      color:#1a140f;
      backdrop-filter:blur(7px);
      -webkit-backdrop-filter:blur(7px);
    }
  }
</style>
</head>
<body>

<!-- ============ PAGE 1 — home ============ -->
<main id="top">

  <!-- ============ WORK: underneath — duplicate this whole block, plus its entry in the WORKS object below, for each new piece ============ -->
  <section class="work" onclick="openWork('underneath')">
    <div class="pane" data-role="natural">
      <img src="images/underneath-natural.jpg" alt="Natural texture — flowing paint and a dry leaf">
      <span class="word">flow.</span>
    </div>
    <div class="pane" data-role="artwork">
      <img src="images/underneath-framed-square.png" alt="Underneath — framed acrylic painting, three pale forms on dark ground">
      <span class="word">underneath.</span>
    </div>
  </section>

  <!-- ============ WORK: unreadable ============ -->
  <section class="work" onclick="openWork('unreadable')">
    <div class="pane" data-role="natural">
      <img src="images/unreadable-natural.jpg" alt="Natural texture — dark traces flowing through pale stone">
      <span class="word">sign.</span>
    </div>
    <div class="pane" data-role="artwork">
      <img src="images/unreadable-artwork-square.png" alt="Unreadable — four repeated black forms and a small red mark on a sand-coloured ground">
      <span class="word">unreadable.</span>
    </div>
  </section>

  <!-- ============ WORK: underline ============ -->
  <section class="work" onclick="openWork('underline')">
    <div class="pane" data-role="natural">
      <img src="images/underline-natural-v2.jpg" alt="Natural texture — black veins through cool stone">
      <span class="word">trace.</span>
    </div>
    <div class="pane" data-role="artwork">
      <img src="images/underline-artwork-square.png" alt="Underline — framed acrylic painting, a dark looping form around a small square green brushstroke">
      <span class="word">underline.</span>
    </div>
  </section>

</main>

<!-- ============ PAGE 2 — work detail (populated dynamically by openWork) ============ -->
<div class="work-detail" id="workDetail">
  <button class="close-btn" onclick="closeWork()" aria-label="Close">✕</button>

  <div class="detail-grid">
    <div class="detail-images" id="detailGallery" aria-label="Artwork images">
      <div class="detail-slide active"><img id="wdImg1" src="" alt=""></div>
      <div class="detail-slide"><img id="wdImg2" src="" alt=""></div>
      <div class="detail-slide"><img id="wdImg3" src="" alt=""></div>
      <button class="gallery-btn prev" type="button" onclick="event.stopPropagation(); changeSlide(-1)" aria-label="Previous image">&#8592;</button>
      <button class="gallery-btn next" type="button" onclick="event.stopPropagation(); changeSlide(1)" aria-label="Next image">&#8594;</button>
      <div class="gallery-count" id="galleryCount" aria-live="polite">1 / 3</div>
    </div>

    <div class="detail-info">
      <div class="eyebrow">Original painting</div>
      <h1 id="wdTitle"></h1>
      <div class="specs" id="wdSpecs"></div>

      <div class="description" id="wdDescription"></div>

      <div class="inquiries-block">
        <div class="eyebrow" id="inquiryLabel">Inquiries</div>
        <form class="inquiry-form" id="inquiryForm" action="https://formspree.io/f/xyegvnad" method="POST" onsubmit="handleSubmit(event)">
          <input type="email" id="email" name="email" required placeholder="your email">
          <button type="submit">Send</button>
        </form>
        <div class="sent-msg" id="sentMsg">Thank you — I'll be in touch soon.</div>
      </div>
    </div>
  </div>
</div>

<script>
  // ============ Works data — add a new key here for each new piece ============
  const WORKS = {
    underneath: {
      title: 'Underneath (sold)',
      images: [
        {src:'images/underneath-interior.jpg', alt:'Underneath — the painting shown framed in an interior'},
        {src:'images/underneath-framed-square.png', mobileSrc:'images/underneath-framed-portrait.png', alt:'Underneath — full view of the framed painting'},
        {src:'images/underneath-detail-v2.jpg', alt:'Underneath — close detail of the painting'}
      ],
      inquiryLabel: 'Commission a similar work',
      specs: ['60 × 80 cm', 'Acrylic on canvas', 'Wooden floater frame included'],
      description: [
        'This painting is the translation of a path that began two years ago.',
        'Beneath the visible surface is an earlier painting, complete, resolved, already "finished" in another sense. I covered it not to erase it, but so it could keep existing as structure rather than image.',
        'The three forms emerging from the brown ground are a single gesture repeated three times, never identical — what remains once everything else is stripped away.',
        'For the first time, I recognize in a piece not just a body of work, but an identity built, layer after layer, over these two years.'
      ]
    },
    unreadable: {
      title: 'Unreadable',
      images: [
        {src:'images/unreadable-interior.jpg', alt:'Unreadable — the painting shown in a calm interior'},
        {src:'images/unreadable-artwork-square.png', mobileSrc:'images/unreadable-artwork-portrait.png', alt:'Unreadable — full view of the framed painting'},
        {src:'images/unreadable-detail.jpg', alt:'Unreadable — close detail of the red mark and black gesture'}
      ],
      inquiryLabel: 'Inquiries',
      specs: ['60 × 80 cm', 'Acrylic on canvas', 'Wooden floater frame included'],
      description: [
        '<strong>This painting explores the space between gesture and language.</strong>',
        'The four forms emerge from a warm, sand-coloured ground through a repeated gesture — similar, but never identical.',
        'They could be read as bodies, fragments, traces, or letters. They suggest something familiar without ever becoming fully readable.',
        'The gesture carries the possibility of meaning, but resists being translated into words.',
        'A small red mark interrupts the composition — a simple, almost distant presence within the repetition.',
        '<strong>Unreadable is not about the absence of meaning, but about what remains when meaning cannot be fully deciphered.</strong>',
        'For me, the work continues the exploration of gesture, repetition and the space between what we recognize and what we cannot name.',
        'For inquiries, write to me.'
      ]
    },
    underline: {
      title: 'Underline',
      images: [
        {src:'images/underline-interior-dark-frame.png', alt:'Underline — the painting in a dark floater frame above a rustic wooden console table'},
        {src:'images/underline-artwork-square.png', mobileSrc:'images/underline-artwork-portrait.png', alt:'Underline — full view of the framed painting'},
        {src:'images/underline-detail-v2.jpg', alt:'Underline — close detail of the green mark and black gesture'}
      ],
      inquiryLabel: 'Inquiries',
      specs: ['30 × 30 cm', 'Acrylic on canvas', 'Wooden floater frame included'],
      description: [
        'Before this, there was another painting — brighter, more playful, already whole in its own way.',
        'I covered it. Not to erase what it was, but because it needed to become foundation rather than surface — the same instinct that shaped Underneath, here translated into something smaller, tighter.',
        'The dark loop that fills the canvas is a single line, doubled back on itself until it becomes a knot.',
        'Inside the loop, a small brushstroke of green jade stands apart. Nearly square, geometric, unlike anything else on the canvas. A single drip runs from it and becomes the only straight, horizontal line in the whole painting.',
        'What gets underlined, stays.'
      ]
    }
  };

  let currentSlide = 0;
  let touchStartX = 0;

  function showSlide(index){
    const slides = Array.from(document.querySelectorAll('.detail-slide'));
    currentSlide = (index + slides.length) % slides.length;
    slides.forEach((slide, i) => slide.classList.toggle('active', i === currentSlide));
    document.getElementById('galleryCount').textContent = (currentSlide + 1) + ' / ' + slides.length;
  }

  function changeSlide(direction){ showSlide(currentSlide + direction); }

  function openWork(key){
    const data = WORKS[key];
    if (!data) return;

    document.getElementById('wdTitle').textContent = data.title;
    document.getElementById('wdSpecs').innerHTML = data.specs.map(s => '<div>' + s + '</div>').join('');
    document.getElementById('wdDescription').innerHTML = data.description.map(p => '<p>' + p + '</p>').join('');

    data.images.forEach((image, index) => {
      const img = document.getElementById('wdImg' + (index + 1));
      img.src = window.innerWidth <= 860 && image.mobileSrc ? image.mobileSrc : image.src;
      img.alt = image.alt;
    });
    document.getElementById('inquiryLabel').textContent = data.inquiryLabel;
    showSlide(0);

    const el = document.getElementById('workDetail');
    el.classList.add('open');
    document.body.style.overflow = 'hidden';
    history.pushState({work:key}, '', '#' + key);
  }

  function closeWork(){
    const el = document.getElementById('workDetail');
    if (!el.classList.contains('open')) return;
    el.classList.remove('open');
    document.body.style.overflow = '';
    if (location.hash) history.back();
    // reset form state
    const form = document.getElementById('inquiryForm');
    form.reset();
    form.style.display = 'flex';
    const button = form.querySelector('button');
    button.textContent = 'Send';
    button.disabled = false;
    document.getElementById('sentMsg').style.display = 'none';
  }

  window.addEventListener('popstate', () => {
    const key = location.hash.replace('#', '');
    if (!WORKS[key]){
      document.getElementById('workDetail').classList.remove('open');
      document.body.style.overflow = '';
    }
  });

  document.addEventListener('keydown', event => {
    if (!document.getElementById('workDetail').classList.contains('open')) return;
    if (event.key === 'ArrowLeft') changeSlide(-1);
    if (event.key === 'ArrowRight') changeSlide(1);
    if (event.key === 'Escape') closeWork();
  });

  document.getElementById('detailGallery').addEventListener('touchstart', event => {
    touchStartX = event.changedTouches[0].clientX;
  }, {passive:true});

  document.getElementById('detailGallery').addEventListener('touchend', event => {
    const distance = event.changedTouches[0].clientX - touchStartX;
    if (Math.abs(distance) > 45) changeSlide(distance > 0 ? -1 : 1);
  }, {passive:true});

  function handleSubmit(e){
    e.preventDefault();
    const form = document.getElementById('inquiryForm');
    const sentMsg = document.getElementById('sentMsg');
    const button = form.querySelector('button');
    const originalLabel = button.textContent;

    button.textContent = 'Sending…';
    button.disabled = true;

    fetch(form.action, {
      method: 'POST',
      body: new FormData(form),
      headers: { 'Accept': 'application/json' }
    })
    .then(response => {
      if (response.ok){
        form.style.display = 'none';
        sentMsg.textContent = "Thank you — I'll be in touch soon.";
        sentMsg.style.color = '#443628';
        sentMsg.style.display = 'block';
      } else {
        sentMsg.textContent = "Something went wrong — please try again, or write to me directly.";
        sentMsg.style.color = '#8a3b2b';
        sentMsg.style.display = 'block';
        button.textContent = originalLabel;
        button.disabled = false;
      }
    })
    .catch(() => {
      sentMsg.textContent = "Something went wrong — please try again, or write to me directly.";
      sentMsg.style.color = '#8a3b2b';
      sentMsg.style.display = 'block';
      button.textContent = originalLabel;
      button.disabled = false;
    });
  }
</script>

</body>
</html>
